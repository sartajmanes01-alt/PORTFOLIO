<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="nav">
    <a href="#home" class="logo" id="logo">SS</a>
    <nav id="menu">
      <a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a>
      <a href="#certs">Certifications</a><a href="#experience">Experience</a><a href="#contact">Contact</a>
    </nav>
    <div class="nav-r">
      <button id="theme" aria-label="Toggle light and dark theme">◐</button>
      <button id="burger" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
  <div class="hero-container">
    <div class="hero-text">
      <p class="eyebrow">Hello, I am</p>
      <h1 id="name" class="grad"></h1>
      <p class="roles">I am a <span id="typed"></span><span class="caret">|</span></p>
      <p class="lead" id="tagline"></p>
      <div class="btns" id="heroBtns"></div>
    </div>
    
    <div class="hero-image">
      <div class="glow-avatar">
        <img src="profile-photo.jpg" alt="Profile Photo" id="profileImg">
      </div>
    </div>
  </div>
  <div class="stats" id="stats" style="display: none;"></div>
    </section>

    <section id="about" class="reveal"><h2>About me</h2><div id="aboutText"></div></section>
    <section id="skills" class="reveal"><h2>Skills</h2><div class="skill-grid" id="skillsWrap"></div></section>
    <section id="projects" class="reveal"><h2>Projects</h2><div class="filters" id="filters"></div><div class="grid" id="projGrid"></div></section>
    <section id="certs" class="reveal"><h2>Certifications</h2><div class="grid" id="certGrid"></div></section>
    <section id="experience" class="reveal"><h2>Experience &amp; education</h2><div class="timeline" id="timeline"></div></section>
    <section id="contact" class="reveal"><h2>Let us connect</h2><p class="lead" id="contactText"></p><div class="btns" id="contactLinks"></div></section>
